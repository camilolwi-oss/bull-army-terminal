# GitHub Pages solo publica una redirección: la terminal se mudó a Railway (https://terminal-production-7210.up.railway.app).
# Dirección vieja: https://camilolwi-oss.github.io/bull-army-terminal/
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Página de redirección
        run: |
          mkdir -p site
          cp redirect/index.html redirect/404.html redirect/sw.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
