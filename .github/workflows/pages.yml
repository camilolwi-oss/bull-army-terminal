# Publica la terminal en GitHub Pages con cada push a main y cada hora (para renovar el calendario macro).
# Dirección: https://camilolwi-oss.github.io/bull-army-terminal/
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # cada hora, al minuto 17 (fuera de la hora en punto, cuando GitHub está más cargado)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Calendario macro (ForexFactory)
        # Si ForexFactory falla o limita los pedidos, se reutiliza el último calendario publicado.
        run: |
          node scripts/calendario.mjs src/calendario.json \
            || curl -fsS "https://camilolwi-oss.github.io/bull-army-terminal/calendario.json" -o src/calendario.json \
            || echo "Sin calendario en este deploy"
      - name: Posiciones de las 5000 cuentas más grandes (mapa de liquidaciones)
        # Se escanean en los deploys programados (unos 10 minutos). En un push se reutiliza el último publicado.
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then node scripts/wallets.mjs src/liq-wallets.json 5000 && exit 0; fi
          curl -fsS "https://camilolwi-oss.github.io/bull-army-terminal/liq-wallets.json" -o src/liq-wallets.json \
            || echo "Sin posiciones de wallets en este deploy"
      - name: Armar la página, la lista de accesos y la PWA
        run: |
          npm run build
          mkdir -p site
          cp -r dist/. site/
          mv site/bull-army-extremos.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
